<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>PS Coach Schedule</title>
  <meta name="description" content="Padel Society weekly coaching schedule" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f1729" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PS Coach" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- React + Babel + Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body { background: #080c16; color: #f1f5f9; font-family: 'Outfit', system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulseOpacity { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .anim-fade { animation: fadeUp 0.4s ease-out backwards; }
    .anim-slide { animation: slideUp 0.3s ease-out; }
    .anim-pop { animation: pop 0.2s ease-out; }
    .pulse-fade { animation: pulseOpacity 2.5s ease-in-out infinite; }
    /* Splash before React mounts */
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #080c16; z-index: 9999; transition: opacity 0.3s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .ring { width: 36px; height: 36px; border: 3px solid rgba(190,242,100,0.18); border-top-color: #bef264; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash"><div class="ring"></div></div>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const STORAGE_KEY = 'ps-schedule-v4';
    const PAT_KEY = 'ps-schedule-pat-v1';
    const START_HOUR = 7;
    const END_HOUR = 23;
    const HOURS = Array.from({ length: END_HOUR - START_HOUR }, (_, i) => START_HOUR + i);

    // --- GitHub-as-DB config ---
    const REPO_OWNER = 'padelociety';
    const REPO_NAME = 'PS-coach';
    const DATA_PATH = 'data.json';
    const RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DATA_PATH}`;
    const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_PATH}`;
    const POLL_MS = 30000;
    const SAVE_DEBOUNCE_MS = 2000;

    // Encode a string to base64 safely (handles UTF-8 incl. Korean)
    function toBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }
    function fromBase64(b64) {
      return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
    }

    // Get current data.json + its sha (sha needed for updates). Returns null on failure.
    async function ghFetchWithSha(pat) {
      try {
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (pat) headers['Authorization'] = `Bearer ${pat}`;
        const res = await fetch(`${API_URL}?ref=main&cb=${Date.now()}`, { headers, cache: 'no-store' });
        if (res.status === 404) return { data: null, sha: null, notFound: true };
        if (!res.ok) return null;
        const json = await res.json();
        const text = fromBase64(json.content || '');
        return { data: JSON.parse(text), sha: json.sha };
      } catch (e) { return null; }
    }

    // Fetch raw data.json (no sha, public, no rate limit). For read-only viewers.
    async function ghFetchRaw() {
      try {
        const res = await fetch(`${RAW_URL}?cb=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) { return null; }
    }

    // Push data.json to GitHub. Returns new sha. Throws on failure.
    async function ghPush(data, pat, prevSha) {
      const body = {
        message: `Update schedule (${new Date().toISOString().slice(0,19).replace('T',' ')} UTC)`,
        content: toBase64(JSON.stringify(data, null, 2) + '\n'),
        branch: 'main',
      };
      if (prevSha) body.sha = prevSha;
      const res = await fetch(API_URL, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${pat}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error(`${res.status}: ${err.slice(0, 200)}`);
      }
      const json = await res.json();
      return json.content && json.content.sha;
    }

    const BUILTIN_LESSON_TYPES = ['Basics', 'Forehand', 'Backhand', 'Volley', 'Bandeja', 'Vibora', 'Smash', 'Positioning', 'Tactics', 'Match'];
    const CUSTOM_COLOR_PALETTE = ['#ef4444', '#10b981', '#a855f7', '#f43f5e', '#14b8a6', '#84cc16', '#f97316', '#22d3ee', '#eab308', '#d946ef'];

    const INITIAL_DATA = [
      {
        day: 'MON', date: 'MAY 18',
        slots: [
          { startHour: 14, duration: 1, student: 'Jiwon', lessonType: ['Forehand'], notes: 'Work on topspin and follow-through' },
          { startHour: 15, duration: 1, student: 'HK', lessonType: ['Backhand'], notes: '' },
          { startHour: 16, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 17, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 18, duration: 1, student: 'Tomasco', lessonType: ['Smash'], notes: '' },
          { startHour: 19, duration: 1, student: 'David', lessonType: ['Volley'], notes: '' },
          { startHour: 20, duration: 1, student: 'Huny', lessonType: ['Basics'], notes: '' },
          { startHour: 21, duration: 1, student: '4 Group', lessonType: ['Match'], notes: '' },
        ]
      },
      {
        day: 'TUE', date: 'MAY 19',
        slots: [
          { startHour: 7, duration: 2, student: '3 Group', lessonType: ['Tactics'], notes: 'Net play formations and lob defense' },
          { startHour: 9, duration: 1, student: 'Jieun', lessonType: ['Backhand'], notes: '' },
          { startHour: 16, duration: 1, student: 'Jiwon', lessonType: ['Volley'], notes: '' },
          { startHour: 17, duration: 1, student: 'David', lessonType: ['Tactics'], notes: '' },
          { startHour: 18, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 21, duration: 1, student: '4 Group', lessonType: ['Match'], notes: '' },
          { startHour: 22, duration: 1, student: '', lessonType: [], notes: '' },
        ]
      },
      {
        day: 'WED', date: 'MAY 20',
        slots: [
          { startHour: 7, duration: 1, student: 'Jeehee, Jieun', lessonType: ['Basics'], notes: '' },
          { startHour: 8, duration: 1, student: 'Jiwon, HK', lessonType: ['Positioning'], notes: '' },
          { startHour: 9, duration: 1, student: 'Jieun', lessonType: ['Volley'], notes: '' },
          { startHour: 11, duration: 1, student: 'Jiwon', lessonType: ['Bandeja', 'Vibora'], notes: '' },
          { startHour: 14, duration: 1, student: 'David', lessonType: ['Match'], notes: '' },
          { startHour: 15, duration: 2, student: 'Junwoo', lessonType: ['Match', 'Tactics'], notes: 'Tournament prep — focus on left-side patterns' },
          { startHour: 18, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 19, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 20, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 21, duration: 1, student: '', lessonType: [], notes: '' },
        ]
      },
      {
        day: 'THU', date: 'MAY 21',
        slots: [
          { startHour: 7, duration: 2, student: '3 Group', lessonType: ['Tactics'], notes: 'Net play formations and lob defense' },
          { startHour: 9, duration: 1, student: 'Jieun', lessonType: ['Forehand'], notes: '' },
        ]
      },
    ];

    const DAY_COLORS = [
      { main: '#bef264', rgb: '190,242,100' },
      { main: '#7dd3fc', rgb: '125,211,252' },
      { main: '#fcd34d', rgb: '252,211,77' },
      { main: '#f9a8d4', rgb: '249,168,212' },
    ];

    const BUILTIN_TYPE_COLORS = {
      'Basics': '#94a3b8', 'Forehand': '#bef264', 'Backhand': '#a3e635',
      'Volley': '#7dd3fc', 'Bandeja': '#38bdf8', 'Vibora': '#06b6d4',
      'Smash': '#fb923c', 'Positioning': '#fcd34d', 'Tactics': '#c084fc',
      'Match': '#f9a8d4',
    };

    function fmtHour(h) {
      if (h === 0) return '12';
      if (h === 12) return '12';
      return String(h > 12 ? h - 12 : h);
    }
    function ampm(h) { return h < 12 ? 'AM' : 'PM'; }
    function fmtTimeRange(start, duration) {
      const end = start + duration;
      const sH = start === 0 ? 12 : start > 12 ? start - 12 : start;
      const eH = end === 0 ? 12 : end > 12 ? end - 12 : end;
      const sAp = start < 12 ? 'AM' : 'PM';
      const eAp = end < 12 || end === 24 ? 'AM' : 'PM';
      if (sAp === eAp) return `${sH}–${eH} ${eAp}`;
      return `${sH} ${sAp}–${eH} ${eAp}`;
    }

    // Migration: Korean lesson types → English, string → array
    const KR_TO_EN = {
      '기초': 'Basics', '포핸드': 'Forehand', '백핸드': 'Backhand',
      '발리': 'Volley', '반데하': 'Bandeja', '스매시': 'Smash',
      '포지셔닝': 'Positioning', '전술': 'Tactics', '게임': 'Match',
    };
    const migrateDays = (rawDays) => rawDays.map(d => ({
      ...d,
      slots: (d.slots || []).map(s => {
        let lt = s.lessonType;
        if (typeof lt === 'string') lt = lt ? [lt] : [];
        if (!Array.isArray(lt)) lt = [];
        lt = lt.map(t => KR_TO_EN[t] || t).filter(Boolean);
        return { ...s, lessonType: lt, notes: typeof s.notes === 'string' ? s.notes : '' };
      }),
    }));

    function Schedule() {
      const [coach, setCoach] = useState('Saul');
      const [days, setDays] = useState(INITIAL_DATA);
      const [edit, setEdit] = useState(null);
      const [editCoach, setEditCoach] = useState(false);
      const [tempCoach, setTempCoach] = useState('');
      const [hydrated, setHydrated] = useState(false);
      const [customLessonTypes, setCustomLessonTypes] = useState([]);
      const [customTypeColors, setCustomTypeColors] = useState({});
      const [confirmDeleteType, setConfirmDeleteType] = useState(null);
      const [updateAvailable, setUpdateAvailable] = useState(false);

      // --- Sync state ---
      const [pat, setPat] = useState(() => { try { return localStorage.getItem(PAT_KEY) || ''; } catch (e) { return ''; } });
      const [showSettings, setShowSettings] = useState(false);
      const [syncState, setSyncState] = useState('idle'); // 'idle' | 'pending' | 'syncing' | 'synced' | 'error' | 'offline'
      const [syncError, setSyncError] = useState('');
      const shaRef = useRef(null);
      const lastPushedRef = useRef('');
      const saveTimerRef = useRef(null);
      const isEditingRef = useRef(false);
      useEffect(() => { isEditingRef.current = !!edit || editCoach || showSettings; }, [edit, editCoach, showSettings]);

      const isAdmin = !!pat;

      const lessonTypes = useMemo(() => [...BUILTIN_LESSON_TYPES, ...customLessonTypes], [customLessonTypes]);
      const typeColor = (t) => BUILTIN_TYPE_COLORS[t] || customTypeColors[t] || '#94a3b8';

      const addCustomLessonType = (name) => {
        const n = (name || '').trim();
        if (!n) return false;
        if (BUILTIN_LESSON_TYPES.includes(n) || customLessonTypes.includes(n)) return false;
        const usedColors = new Set(Object.values(customTypeColors));
        const nextColor = CUSTOM_COLOR_PALETTE.find(c => !usedColors.has(c))
          || CUSTOM_COLOR_PALETTE[customLessonTypes.length % CUSTOM_COLOR_PALETTE.length];
        setCustomLessonTypes(prev => [...prev, n]);
        setCustomTypeColors(prev => ({ ...prev, [n]: nextColor }));
        return true;
      };

      const deleteCustomLessonType = (name) => {
        setCustomLessonTypes(prev => prev.filter(t => t !== name));
        setCustomTypeColors(prev => { const next = { ...prev }; delete next[name]; return next; });
        setDays(prev => prev.map(d => ({
          ...d,
          slots: d.slots.map(s => ({ ...s, lessonType: (s.lessonType || []).filter(t => t !== name) })),
        })));
        if (edit) setEdit(e => e ? ({ ...e, lessonType: (e.lessonType || []).filter(t => t !== name) }) : e);
        setConfirmDeleteType(null);
      };

      // Apply a parsed data snapshot to state (used by initial load + polling)
      const applySnapshot = useCallback((parsed) => {
        if (!parsed || typeof parsed !== 'object') return;
        if (typeof parsed.coach === 'string') setCoach(parsed.coach);
        if (Array.isArray(parsed.customLessonTypes)) setCustomLessonTypes(parsed.customLessonTypes);
        if (parsed.customTypeColors && typeof parsed.customTypeColors === 'object') setCustomTypeColors(parsed.customTypeColors);
        if (Array.isArray(parsed.days)) setDays(migrateDays(parsed.days));
      }, []);

      // Initial load: try GitHub first, fall back to localStorage
      useEffect(() => {
        let cancelled = false;
        (async () => {
          let remote = null;
          if (pat) {
            const r = await ghFetchWithSha(pat);
            if (r && r.data) { remote = r.data; shaRef.current = r.sha; }
          }
          if (!remote) {
            const raw = await ghFetchRaw();
            if (raw) remote = raw;
          }
          if (cancelled) return;
          if (remote) {
            applySnapshot(remote);
            const snap = JSON.stringify({ v:1, coach: remote.coach || 'Saul', days: remote.days || INITIAL_DATA, customLessonTypes: remote.customLessonTypes || [], customTypeColors: remote.customTypeColors || {} });
            lastPushedRef.current = snap;
            try { localStorage.setItem(STORAGE_KEY, snap); } catch (e) {}
          } else {
            try {
              const raw = localStorage.getItem(STORAGE_KEY);
              if (raw) applySnapshot(JSON.parse(raw));
            } catch (e) { console.warn('localStorage load failed:', e); }
            setSyncState('offline');
          }
          setHydrated(true);
        })();
        return () => { cancelled = true; };
      // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      // Persist to localStorage on any state change (offline cache)
      useEffect(() => {
        if (!hydrated) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ v:1, coach, days, customLessonTypes, customTypeColors }));
        } catch (e) { console.error('localStorage save failed:', e); }
      }, [coach, days, customLessonTypes, customTypeColors, hydrated]);

      // Debounced push to GitHub when admin edits
      useEffect(() => {
        if (!hydrated || !pat) return;
        const snapshot = { v:1, coach, days, customLessonTypes, customTypeColors };
        const serialized = JSON.stringify(snapshot);
        if (serialized === lastPushedRef.current) return;
        setSyncState('pending');
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(async () => {
          saveTimerRef.current = null;
          setSyncState('syncing');
          try {
            const cur = await ghFetchWithSha(pat);
            const sha = cur && cur.sha ? cur.sha : shaRef.current;
            const newSha = await ghPush(snapshot, pat, sha);
            shaRef.current = newSha || null;
            lastPushedRef.current = serialized;
            setSyncState('synced');
            setSyncError('');
            setTimeout(() => setSyncState(s => s === 'synced' ? 'idle' : s), 1800);
          } catch (e) {
            console.error('GitHub push failed:', e);
            setSyncState('error');
            setSyncError(String(e.message || e));
          }
        }, SAVE_DEBOUNCE_MS);
      }, [coach, days, customLessonTypes, customTypeColors, hydrated, pat]);

      // Polling: fetch latest data.json every POLL_MS, apply if changed
      useEffect(() => {
        if (!hydrated) return;
        const id = setInterval(async () => {
          if (isEditingRef.current) return;
          if (saveTimerRef.current) return;
          if (syncState === 'syncing') return;
          let remote = null;
          if (pat) {
            const r = await ghFetchWithSha(pat);
            if (r && r.data) { remote = r.data; if (r.sha) shaRef.current = r.sha; }
          } else {
            remote = await ghFetchRaw();
          }
          if (!remote) return;
          const remoteStr = JSON.stringify({ v:1, coach: remote.coach || 'Saul', days: remote.days || [], customLessonTypes: remote.customLessonTypes || [], customTypeColors: remote.customTypeColors || {} });
          if (remoteStr === lastPushedRef.current) return;
          applySnapshot(remote);
          lastPushedRef.current = remoteStr;
        }, POLL_MS);
        return () => clearInterval(id);
      }, [hydrated, pat, syncState, applySnapshot]);

      // Hide splash once hydrated
      useEffect(() => {
        if (!hydrated) return;
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('gone');
          setTimeout(() => splash.remove(), 350);
        }
      }, [hydrated]);

      // SW update detection
      useEffect(() => {
        if (!('serviceWorker' in navigator)) return;
        const onMsg = (e) => {
          if (e.data && e.data.type === 'UPDATE_AVAILABLE') setUpdateAvailable(true);
        };
        navigator.serviceWorker.addEventListener('message', onMsg);
        return () => navigator.serviceWorker.removeEventListener('message', onMsg);
      }, []);

      const memberStats = useMemo(() => {
        const map = new Map();
        let totalLessons = 0;
        let totalHours = 0;
        days.forEach((day, dayIdx) => {
          day.slots.forEach(slot => {
            if (!slot.student) return;
            totalLessons++;
            totalHours += (slot.duration || 1);
            const isGroup = /group|team|crew|squad/i.test(slot.student);
            const names = isGroup
              ? [slot.student.trim()]
              : slot.student.split(',').map(n => n.trim()).filter(Boolean);
            names.forEach(name => {
              if (!map.has(name)) map.set(name, { name, sessions: [], typeCounts: {} });
              const entry = map.get(name);
              entry.sessions.push({
                dayIdx, day: day.day, date: day.date,
                startHour: slot.startHour, duration: slot.duration,
                lessonType: Array.isArray(slot.lessonType) ? slot.lessonType : (slot.lessonType ? [slot.lessonType] : []),
                notes: slot.notes || '',
                coStudents: names.filter(n => n !== name),
                isGroup,
              });
              const types = Array.isArray(slot.lessonType) ? slot.lessonType : (slot.lessonType ? [slot.lessonType] : []);
              types.forEach(t => {
                const tt = (t || '').trim();
                if (tt) entry.typeCounts[tt] = (entry.typeCounts[tt] || 0) + 1;
              });
            });
          });
        });
        map.forEach(m => {
          m.sessions.sort((a, b) => a.dayIdx - b.dayIdx || a.startHour - b.startHour);
        });
        const members = Array.from(map.values()).sort((a, b) =>
          b.sessions.length - a.sessions.length || a.name.localeCompare(b.name)
        );
        return { members, totalLessons, totalHours };
      }, [days]);

      const openEdit = (dayIdx, slotIdx, defaultHour = 14) => {
        if (!isAdmin) return;
        if (slotIdx === 'new') {
          setEdit({ dayIdx, slotIdx, startHour: defaultHour, duration: 1, student: '', lessonType: [], notes: '' });
        } else {
          const s = days[dayIdx].slots[slotIdx];
          setEdit({ dayIdx, slotIdx, startHour: s.startHour, duration: s.duration, student: s.student, lessonType: Array.isArray(s.lessonType) ? [...s.lessonType] : (s.lessonType ? [s.lessonType] : []), notes: s.notes || '' });
        }
      };

      const wouldOverlap = (dayIdx, startHour, duration, excludeSlotIdx) => {
        const newEnd = startHour + duration;
        return days[dayIdx].slots.some((s, idx) => {
          if (idx === excludeSlotIdx) return false;
          const sEnd = s.startHour + s.duration;
          return startHour < sEnd && s.startHour < newEnd;
        });
      };

      const saveEdit = () => {
        const { dayIdx, slotIdx, startHour, duration, student, lessonType, notes } = edit;
        if (wouldOverlap(dayIdx, startHour, duration, slotIdx === 'new' ? -1 : slotIdx)) {
          alert('This slot overlaps with another time.');
          return;
        }
        setDays(prev => prev.map((d, i) => {
          if (i !== dayIdx) return d;
          const slots = [...d.slots];
          const slot = { startHour, duration, student: student.trim(), lessonType: (Array.isArray(lessonType) ? lessonType : []).map(t => t.trim()).filter(Boolean), notes: (notes || '').trim() };
          if (slotIdx === 'new') slots.push(slot);
          else slots[slotIdx] = slot;
          slots.sort((a, b) => a.startHour - b.startHour);
          return { ...d, slots };
        }));
        setEdit(null);
      };

      const removeSlot = () => {
        if (edit.slotIdx === 'new') { setEdit(null); return; }
        setDays(prev => prev.map((d, i) => {
          if (i !== edit.dayIdx) return d;
          return { ...d, slots: d.slots.filter((_, si) => si !== edit.slotIdx) };
        }));
        setEdit(null);
      };

      const ROW_HEIGHT = 42;
      const HEADER_HEIGHT = 44;
      const TIME_COL_WIDTH = 40;

      return (
        <div style={{ fontFamily: "'Outfit', system-ui, sans-serif" }} className="min-h-screen w-full text-slate-100">

          {updateAvailable && (
            <div className="sticky top-0 z-[80] bg-[#bef264] text-slate-900 px-4 py-2 text-sm font-bold flex items-center justify-between">
              <span>New version available</span>
              <button onClick={() => window.location.reload()} className="px-3 py-1 rounded-md bg-slate-900 text-[#bef264] text-xs">Update</button>
            </div>
          )}

          <div id="schedule-only-export" style={{ background: 'linear-gradient(180deg, #080c16 0%, #0d1422 50%, #121828 100%)' }} className="relative overflow-hidden">
            <div style={{ position: 'absolute', top: '-150px', left: '-100px', width: '400px', height: '400px', background: 'radial-gradient(circle, rgba(190,242,100,0.12) 0%, transparent 70%)', pointerEvents: 'none' }} />

                  <button onClick={() => setEdit(null)} className="flex-1 px-4 py-3.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 active:scale-95 text-slate-300 font-semibold transition-all">Cancel</button>
                  <button onClick={saveEdit} className="flex-1 px-4 py-3.5 rounded-xl active:scale-95 text-slate-900 font-bold transition-all" style={{ background: DAY_COLORS[edit.dayIdx].main }}>Save</button>
                </div>
              </div>
            </div>
          )}

          {editCoach && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 anim-pop" onClick={() => setEditCoach(false)}>
              <div className="bg-[#182132] border border-slate-700 rounded-3xl w-full max-w-sm p-7 anim-slide" onClick={e => e.stopPropagation()} style={{ fontFamily: "'Outfit', system-ui, sans-serif" }}>
                <div className="text-xl font-black text-slate-100 mb-1">Coach name</div>
                <div className="text-xs text-slate-500 mb-5">Coach name shown at the top</div>
                <input type="text" value={tempCoach} onChange={e => setTempCoach(e.target.value)} autoFocus className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-[#bef264] focus:outline-none transition" />
                <div className="flex gap-2 mt-6">
                  <button onClick={() => setEditCoach(false)} className="flex-1 px-4 py-3.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 font-semibold transition">Cancel</button>
                  <button onClick={() => { if (tempCoach.trim()) setCoach(tempCoach.trim()); setEditCoach(false); }} className="flex-1 px-4 py-3.5 rounded-xl text-slate-900 font-bold transition" style={{ background: 'linear-gradient(135deg, #bef264 0%, #7dd3fc 100%)' }}>Save</button>
                </div>
              </div>
            </div>
          )}

          {confirmDeleteType && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[60] flex items-center justify-center p-4 anim-pop" onClick={() => setConfirmDeleteType(null)}>
              <div className="bg-[#182132] border border-slate-700 rounded-3xl w-full max-w-sm p-7 anim-slide" onClick={e => e.stopPropagation()} style={{ fontFamily: "'Outfit', system-ui, sans-serif" }}>
                <div className="text-xl font-black text-slate-100 mb-2">Delete lesson type?</div>
                <div className="text-sm text-slate-400 mb-3">
                  <span className="font-bold px-2 py-0.5 rounded-full mr-1" style={{ background: `${typeColor(confirmDeleteType)}22`, color: typeColor(confirmDeleteType), border: `1px solid ${typeColor(confirmDeleteType)}44` }}>
                    {confirmDeleteType}
                  </span>
                  will be removed from presets and all slots that currently use it.
                </div>
                <div className="flex gap-2 mt-5">
                  <button onClick={() => setConfirmDeleteType(null)} className="flex-1 px-4 py-3.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 font-semibold transition">Cancel</button>
                  <button onClick={() => deleteCustomLessonType(confirmDeleteType)} className="flex-1 px-4 py-3.5 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 hover:bg-red-500/30 font-bold transition">Delete</button>
                </div>
              </div>
            </div>
          )}

          {/* Sync status pill + Settings gear (top-right, fixed) */}
          <div className="fixed top-3 right-3 z-40 flex items-center gap-2">
            {syncState !== 'idle' && (
              <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider"
                style={{
                  background: syncState === 'error' ? 'rgba(239,68,68,0.15)' :
                              syncState === 'synced' ? 'rgba(52,211,153,0.15)' :
                              syncState === 'offline' ? 'rgba(148,163,184,0.15)' :
                              'rgba(125,211,252,0.15)',
                  border: syncState === 'error' ? '1px solid rgba(239,68,68,0.4)' :
                          syncState === 'synced' ? '1px solid rgba(52,211,153,0.4)' :
                          syncState === 'offline' ? '1px solid rgba(148,163,184,0.4)' :
                          '1px solid rgba(125,211,252,0.4)',
                  color: syncState === 'error' ? '#fca5a5' :
                         syncState === 'synced' ? '#6ee7b7' :
                         syncState === 'offline' ? '#cbd5e1' :
                         '#7dd3fc',
                }}>
                {(syncState === 'pending' || syncState === 'syncing') && (
                  <span className="inline-block w-1.5 h-1.5 rounded-full" style={{ background: '#7dd3fc', animation: 'pulseOpacity 1.2s ease-in-out infinite' }} />
                )}
                {syncState === 'synced' && (
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                )}
                {syncState === 'error' && (<span>!</span>)}
                <span>
                  {syncState === 'pending' && 'PENDING'}
                  {syncState === 'syncing' && 'SYNCING'}
                  {syncState === 'synced' && 'SAVED'}
                  {syncState === 'error' && 'ERROR'}
                  {syncState === 'offline' && 'OFFLINE'}
                </span>
              </div>
            )}
            <button
              onClick={() => setShowSettings(true)}
              aria-label="Settings"
              title="Settings"
              className="w-9 h-9 rounded-full active:scale-90 transition-all flex items-center justify-center"
              style={{ background: 'rgba(24,33,50,0.7)', backdropFilter: 'blur(6px)', border: '1px solid rgba(148,163,184,0.25)' }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={isAdmin ? '#bef264' : '#cbd5e1'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
          </div>

          {showSettings && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-[70] flex items-end sm:items-center justify-center sm:p-4 anim-pop" onClick={() => setShowSettings(false)}>
              <div className="bg-[#182132] border border-slate-700 rounded-t-3xl sm:rounded-3xl w-full sm:max-w-md p-6 sm:p-7 anim-slide max-h-[92vh] overflow-y-auto" onClick={e => e.stopPropagation()} style={{ fontFamily: "'Outfit', system-ui, sans-serif" }}>
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <div className="text-xl font-black text-slate-100">Settings</div>
                    <div className="mono text-[10px] tracking-wider mt-0.5 text-slate-400">SYNC · ADMIN ACCESS</div>
                  </div>
                  <div className="mono text-[10px] font-bold px-2.5 py-1 rounded-full"
                    style={{ background: isAdmin ? 'rgba(190,242,100,0.15)' : 'rgba(148,163,184,0.15)', color: isAdmin ? '#bef264' : '#cbd5e1', border: isAdmin ? '1px solid rgba(190,242,100,0.4)' : '1px solid rgba(148,163,184,0.3)' }}>
                    {isAdmin ? 'ADMIN' : 'READ-ONLY'}
                  </div>
                </div>

                <div className="text-[11px] text-slate-400 leading-relaxed mb-4">
                  Schedule is stored in the <span className="mono text-slate-200">{REPO_OWNER}/{REPO_NAME}</span> repo and synced across all devices.
                  To edit, paste a GitHub <span className="font-bold text-slate-200">fine-grained personal access token</span> with
                  <span className="mono text-[#bef264]"> Contents: Read &amp; Write</span> on this repo.
                </div>

                <label className="block text-[10px] font-bold tracking-[0.2em] mb-2 text-[#bef264]">GITHUB TOKEN</label>
                <input
                  id="pat-input"
                  type="password"
                  defaultValue={pat}
                  placeholder="github_pat_…"
                  autoComplete="off"
                  className="w-full mono bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-3 text-slate-100 text-xs placeholder-slate-600 focus:border-[#bef264] focus:outline-none transition"
                />
                <div className="text-[10px] text-slate-500 mt-1.5 leading-snug">
                  Token is stored in this browser only (<span className="mono">localStorage</span>) — never sent to anyone except GitHub.
                </div>

                {syncError && (
                  <div className="mt-3 p-2.5 rounded-lg text-[11px] leading-snug" style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', color: '#fca5a5' }}>
                    <span className="font-bold">Last error:</span> <span className="mono break-all">{syncError}</span>
                  </div>
                )}

                <div className="flex gap-2 mt-5">
                  {isAdmin && (
                    <button
                      onClick={() => {
                        try { localStorage.removeItem(PAT_KEY); } catch (e) {}
                        setPat('');
                        setSyncError('');
                        setSyncState('idle');
                      }}
                      className="px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 active:scale-95 font-semibold text-sm transition">
                      Sign out
                    </button>
                  )}
                  <button onClick={() => setShowSettings(false)} className="flex-1 px-4 py-3 rounded-xl bg-slate-700/50 hover:bg-slate-700 active:scale-95 text-slate-300 font-semibold text-sm transition">Cancel</button>
                  <button
                    onClick={() => {
                      const v = (document.getElementById('pat-input')?.value || '').trim();
                      if (!v) { try { localStorage.removeItem(PAT_KEY); } catch (e) {}; setPat(''); setShowSettings(false); return; }
                      try { localStorage.setItem(PAT_KEY, v); } catch (e) {}
                      setPat(v);
                      setSyncError('');
                      setSyncState('idle');
                      setShowSettings(false);
                    }}
                    className="flex-1 px-4 py-3 rounded-xl text-slate-900 font-bold text-sm transition active:scale-95"
                    style={{ background: 'linear-gradient(135deg, #bef264 0%, #7dd3fc 100%)' }}>
                    Save
                  </button>
                </div>

                <div className="mt-5 pt-4 border-t border-slate-700/50">
                  <div className="text-[10px] font-bold tracking-[0.2em] mb-2 text-slate-400">HOW TO GET A TOKEN</div>
                  <ol className="text-[11px] text-slate-400 space-y-1 leading-relaxed list-decimal list-inside">
                    <li>github.com → top-right avatar → <span className="text-slate-200">Settings</span></li>
                    <li>Left sidebar → <span className="text-slate-200">Developer settings</span></li>
                    <li><span className="text-slate-200">Personal access tokens → Fine-grained tokens</span> → Generate new</li>
                    <li>Repository access: only <span className="mono text-slate-200">{REPO_OWNER}/{REPO_NAME}</span></li>
                    <li>Permissions: <span className="mono text-[#bef264]">Contents</span> = <span className="text-slate-200">Read &amp; write</span></li>
                    <li>Copy the token, paste above, hit Save</li>
                  </ol>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Schedule />);
  </script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          // Detect new SW waiting → notify page
          if (reg.waiting) {
            navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({ type: 'UPDATE_AVAILABLE' });
          }
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                // New version installed, page is currently controlled by older SW
                navigator.serviceWorker.controller.postMessage({ type: 'UPDATE_AVAILABLE' });
                // Optionally activate immediately
                nw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch((err) => console.warn('SW registration failed:', err));

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
