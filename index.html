<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>PS Coach Schedule</title>
  <meta name="description" content="Padel Society weekly coaching schedule" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f1729" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PS Coach" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- React + Babel + Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body { background: #080c16; color: #f1f5f9; font-family: 'Outfit', system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulseOpacity { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .anim-fade { animation: fadeUp 0.4s ease-out backwards; }
    .anim-slide { animation: slideUp 0.3s ease-out; }
    .anim-pop { animation: pop 0.2s ease-out; }
    .pulse-fade { animation: pulseOpacity 2.5s ease-in-out infinite; }
    /* Splash before React mounts */
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #080c16; z-index: 9999; transition: opacity 0.3s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .ring { width: 36px; height: 36px; border: 3px solid rgba(190,242,100,0.18); border-top-color: #bef264; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash"><div class="ring"></div></div>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY = 'ps-schedule-v4';
    const START_HOUR = 7;
    const END_HOUR = 23;
    const HOURS = Array.from({ length: END_HOUR - START_HOUR }, (_, i) => START_HOUR + i);

    const BUILTIN_LESSON_TYPES = ['Basics', 'Forehand', 'Backhand', 'Volley', 'Bandeja', 'Vibora', 'Smash', 'Positioning', 'Tactics', 'Match'];
    const CUSTOM_COLOR_PALETTE = ['#ef4444', '#10b981', '#a855f7', '#f43f5e', '#14b8a6', '#84cc16', '#f97316', '#22d3ee', '#eab308', '#d946ef'];

    const INITIAL_DATA = [
      {
        day: 'MON', date: 'MAY 18',
        slots: [
          { startHour: 14, duration: 1, student: 'Jiwon', lessonType: ['Forehand'], notes: 'Work on topspin and follow-through' },
          { startHour: 15, duration: 1, student: 'HK', lessonType: ['Backhand'], notes: '' },
          { startHour: 16, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 17, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 18, duration: 1, student: 'Tomasco', lessonType: ['Smash'], notes: '' },
          { startHour: 19, duration: 1, student: 'David', lessonType: ['Volley'], notes: '' },
          { startHour: 20, duration: 1, student: 'Huny', lessonType: ['Basics'], notes: '' },
          { startHour: 21, duration: 1, student: '4 Group', lessonType: ['Match'], notes: '' },
        ]
      },
      {
        day: 'TUE', date: 'MAY 19',
        slots: [
          { startHour: 7, duration: 2, student: '3 Group', lessonType: ['Tactics'], notes: 'Net play formations and lob defense' },
          { startHour: 9, duration: 1, student: 'Jieun', lessonType: ['Backhand'], notes: '' },
          { startHour: 16, duration: 1, student: 'Jiwon', lessonType: ['Volley'], notes: '' },
          { startHour: 17, duration: 1, student: 'David', lessonType: ['Tactics'], notes: '' },
          { startHour: 18, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 21, duration: 1, student: '4 Group', lessonType: ['Match'], notes: '' },
          { startHour: 22, duration: 1, student: '', lessonType: [], notes: '' },
        ]
      },
      {
        day: 'WED', date: 'MAY 20',
        slots: [
          { startHour: 7, duration: 1, student: 'Jeehee, Jieun', lessonType: ['Basics'], notes: '' },
          { startHour: 8, duration: 1, student: 'Jiwon, HK', lessonType: ['Positioning'], notes: '' },
          { startHour: 9, duration: 1, student: 'Jieun', lessonType: ['Volley'], notes: '' },
          { startHour: 11, duration: 1, student: 'Jiwon', lessonType: ['Bandeja', 'Vibora'], notes: '' },
          { startHour: 14, duration: 1, student: 'David', lessonType: ['Match'], notes: '' },
          { startHour: 15, duration: 2, student: 'Junwoo', lessonType: ['Match', 'Tactics'], notes: 'Tournament prep — focus on left-side patterns' },
          { startHour: 18, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 19, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 20, duration: 1, student: '', lessonType: [], notes: '' },
          { startHour: 21, duration: 1, student: '', lessonType: [], notes: '' },
        ]
      },
      {
        day: 'THU', date: 'MAY 21',
        slots: [
          { startHour: 7, duration: 2, student: '3 Group', lessonType: ['Tactics'], notes: 'Net play formations and lob defense' },
          { startHour: 9, duration: 1, student: 'Jieun', lessonType: ['Forehand'], notes: '' },
        ]
      },
    ];

    const DAY_COLORS = [
      { main: '#bef264', rgb: '190,242,100' },
      { main: '#7dd3fc', rgb: '125,211,252' },
      { main: '#fcd34d', rgb: '252,211,77' },
      { main: '#f9a8d4', rgb: '249,168,212' },
    ];

    const BUILTIN_TYPE_COLORS = {
      'Basics': '#94a3b8', 'Forehand': '#bef264', 'Backhand': '#a3e635',
      'Volley': '#7dd3fc', 'Bandeja': '#38bdf8', 'Vibora': '#06b6d4',
      'Smash': '#fb923c', 'Positioning': '#fcd34d', 'Tactics': '#c084fc',
      'Match': '#f9a8d4',
    };

    function fmtHour(h) {
      if (h === 0) return '12';
      if (h === 12) return '12';
      return String(h > 12 ? h - 12 : h);
    }
    function ampm(h) { return h < 12 ? 'AM' : 'PM'; }
    function fmtTimeRange(start, duration) {
      const end = start + duration;
      const sH = start === 0 ? 12 : start > 12 ? start - 12 : start;
      const eH = end === 0 ? 12 : end > 12 ? end - 12 : end;
      const sAp = start < 12 ? 'AM' : 'PM';
      const eAp = end < 12 || end === 24 ? 'AM' : 'PM';
      if (sAp === eAp) return `${sH}–${eH} ${eAp}`;
      return `${sH} ${sAp}–${eH} ${eAp}`;
    }

    // Migration: Korean lesson types → English, string → array
    const KR_TO_EN = {
      '기초': 'Basics', '포핸드': 'Forehand', '백핸드': 'Backhand',
      '발리': 'Volley', '반데하': 'Bandeja', '스매시': 'Smash',
      '포지셔닝': 'Positioning', '전술': 'Tactics', '게임': 'Match',
    };
    const migrateDays = (rawDays) => rawDays.map(d => ({
      ...d,
      slots: (d.slots || []).map(s => {
        let lt = s.lessonType;
        if (typeof lt === 'string') lt = lt ? [lt] : [];
        if (!Array.isArray(lt)) lt = [];
        lt = lt.map(t => KR_TO_EN[t] || t).filter(Boolean);
        return { ...s, lessonType: lt, notes: typeof s.notes === 'string' ? s.notes : '' };
      }),
    }));

    function Schedule() {
      const [coach, setCoach] = useState('Saul');
      const [days, setDays] = useState(INITIAL_DATA);
      const [edit, setEdit] = useState(null);
      const [editCoach, setEditCoach] = useState(false);
      const [tempCoach, setTempCoach] = useState('');
      const [confirmReset, setConfirmReset] = useState(false);
      const [hydrated, setHydrated] = useState(false);
      const [imagePreview, setImagePreview] = useState(null);
      const [exporting, setExporting] = useState(null);
      const [h2cReady, setH2cReady] = useState(false);
      const [customLessonTypes, setCustomLessonTypes] = useState([]);
      const [customTypeColors, setCustomTypeColors] = useState({});
      const [confirmDeleteType, setConfirmDeleteType] = useState(null);
      const [showShareModal, setShowShareModal] = useState(false);
      const [pasteInput, setPasteInput] = useState('');
      const [copySuccess, setCopySuccess] = useState(false);
      const [loadBanner, setLoadBanner] = useState(false);
      const [updateAvailable, setUpdateAvailable] = useState(false);

      const lessonTypes = useMemo(() => [...BUILTIN_LESSON_TYPES, ...customLessonTypes], [customLessonTypes]);
      const typeColor = (t) => BUILTIN_TYPE_COLORS[t] || customTypeColors[t] || '#94a3b8';

      const addCustomLessonType = (name) => {
        const n = (name || '').trim();
        if (!n) return false;
        if (BUILTIN_LESSON_TYPES.includes(n) || customLessonTypes.includes(n)) return false;
        const usedColors = new Set(Object.values(customTypeColors));
        const nextColor = CUSTOM_COLOR_PALETTE.find(c => !usedColors.has(c))
          || CUSTOM_COLOR_PALETTE[customLessonTypes.length % CUSTOM_COLOR_PALETTE.length];
        setCustomLessonTypes(prev => [...prev, n]);
        setCustomTypeColors(prev => ({ ...prev, [n]: nextColor }));
        return true;
      };

      const deleteCustomLessonType = (name) => {
        setCustomLessonTypes(prev => prev.filter(t => t !== name));
        setCustomTypeColors(prev => { const next = { ...prev }; delete next[name]; return next; });
        setDays(prev => prev.map(d => ({
          ...d,
          slots: d.slots.map(s => ({ ...s, lessonType: (s.lessonType || []).filter(t => t !== name) })),
        })));
        if (edit) setEdit(e => e ? ({ ...e, lessonType: (e.lessonType || []).filter(t => t !== name) }) : e);
        setConfirmDeleteType(null);
      };

      // URL hash share
      const encodeStateToString = () => {
        try {
          const state = { v: 1, coach, days, customLessonTypes, customTypeColors };
          return btoa(unescape(encodeURIComponent(JSON.stringify(state))));
        } catch (e) { console.error(e); return ''; }
      };
      const shareUrl = useMemo(() => {
        try {
          const encoded = encodeStateToString();
          if (!encoded) return '';
          return `${window.location.origin}${window.location.pathname}#schedule=${encoded}`;
        } catch (e) { return ''; }
      }, [coach, days, customLessonTypes, customTypeColors]);

      const handleCopyShare = async () => {
        try {
          await navigator.clipboard.writeText(shareUrl);
          setCopySuccess(true);
          setTimeout(() => setCopySuccess(false), 2000);
        } catch (e) {
          alert('Could not copy automatically. Long-press the link to copy it manually.');
        }
      };

      const handleLoadFromInput = () => {
        const input = (pasteInput || '').trim();
        if (!input) return;
        try {
          let encoded = input;
          const hashIdx = input.indexOf('#schedule=');
          if (hashIdx >= 0) encoded = input.slice(hashIdx + '#schedule='.length);
          const json = decodeURIComponent(escape(atob(encoded)));
          const data = JSON.parse(json);
          if (data.coach) setCoach(data.coach);
          if (Array.isArray(data.days)) setDays(migrateDays(data.days));
          if (Array.isArray(data.customLessonTypes)) setCustomLessonTypes(data.customLessonTypes);
          if (data.customTypeColors && typeof data.customTypeColors === 'object') setCustomTypeColors(data.customTypeColors);
          setPasteInput('');
          setShowShareModal(false);
          setLoadBanner(true);
          setTimeout(() => setLoadBanner(false), 3000);
        } catch (e) {
          alert('Could not load — the link or code is invalid.');
        }
      };

      // Load html2canvas
      useEffect(() => {
        if (window.html2canvas) { setH2cReady(true); return; }
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.onload = () => setH2cReady(true);
        script.onerror = () => console.warn('html2canvas failed to load');
        document.head.appendChild(script);
      }, []);

      // Hydrate from URL hash or localStorage
      useEffect(() => {
        try {
          const hash = window.location.hash || '';
          if (hash.startsWith('#schedule=')) {
            const encoded = hash.slice('#schedule='.length);
            const json = decodeURIComponent(escape(atob(encoded)));
            const data = JSON.parse(json);
            if (data.coach) setCoach(data.coach);
            if (Array.isArray(data.days)) setDays(migrateDays(data.days));
            if (Array.isArray(data.customLessonTypes)) setCustomLessonTypes(data.customLessonTypes);
            if (data.customTypeColors && typeof data.customTypeColors === 'object') setCustomTypeColors(data.customTypeColors);
            setLoadBanner(true);
            setTimeout(() => setLoadBanner(false), 4000);
            setHydrated(true);
            return;
          }
        } catch (e) { console.warn('Hash decode failed:', e); }

        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.coach) setCoach(parsed.coach);
            if (Array.isArray(parsed.customLessonTypes)) setCustomLessonTypes(parsed.customLessonTypes);
            if (parsed.customTypeColors && typeof parsed.customTypeColors === 'object') setCustomTypeColors(parsed.customTypeColors);
            if (parsed.days) setDays(migrateDays(parsed.days));
          }
        } catch (e) { console.warn('localStorage load failed:', e); }
        setHydrated(true);
      }, []);

      // Persist
      useEffect(() => {
        if (!hydrated) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ coach, days, customLessonTypes, customTypeColors }));
        } catch (e) { console.error('Save failed:', e); }
      }, [coach, days, customLessonTypes, customTypeColors, hydrated]);

      // Hide splash once hydrated
      useEffect(() => {
        if (!hydrated) return;
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('gone');
          setTimeout(() => splash.remove(), 350);
        }
      }, [hydrated]);

      // SW update detection
      useEffect(() => {
        if (!('serviceWorker' in navigator)) return;
        const onMsg = (e) => {
          if (e.data && e.data.type === 'UPDATE_AVAILABLE') setUpdateAvailable(true);
        };
        navigator.serviceWorker.addEventListener('message', onMsg);
        return () => navigator.serviceWorker.removeEventListener('message', onMsg);
      }, []);

      const memberStats = useMemo(() => {
        const map = new Map();
        let totalLessons = 0;
        let totalHours = 0;
        days.forEach((day, dayIdx) => {
          day.slots.forEach(slot => {
            if (!slot.student) return;
            totalLessons++;
            totalHours += (slot.duration || 1);
            const isGroup = /group|team|crew|squad/i.test(slot.student);
            const names = isGroup
              ? [slot.student.trim()]
              : slot.student.split(',').map(n => n.trim()).filter(Boolean);
            names.forEach(name => {
              if (!map.has(name)) map.set(name, { name, sessions: [], typeCounts: {} });
              const entry = map.get(name);
              entry.sessions.push({
                dayIdx, day: day.day, date: day.date,
                startHour: slot.startHour, duration: slot.duration,
                lessonType: Array.isArray(slot.lessonType) ? slot.lessonType : (slot.lessonType ? [slot.lessonType] : []),
                notes: slot.notes || '',
                coStudents: names.filter(n => n !== name),
                isGroup,
              });
              const types = Array.isArray(slot.lessonType) ? slot.lessonType : (slot.lessonType ? [slot.lessonType] : []);
              types.forEach(t => {
                const tt = (t || '').trim();
                if (tt) entry.typeCounts[tt] = (entry.typeCounts[tt] || 0) + 1;
              });
            });
          });
        });
        map.forEach(m => {
          m.sessions.sort((a, b) => a.dayIdx - b.dayIdx || a.startHour - b.startHour);
        });
        const members = Array.from(map.values()).sort((a, b) =>
          b.sessions.length - a.sessions.length || a.name.localeCompare(b.name)
        );
        return { members, totalLessons, totalHours };
      }, [days]);

      const openEdit = (dayIdx, slotIdx, defaultHour = 14) => {
        if (slotIdx === 'new') {
          setEdit({ dayIdx, slotIdx, startHour: defaultHour, duration: 1, student: '', lessonType: [], notes: '' });
        } else {
          const s = days[dayIdx].slots[slotIdx];
          setEdit({ dayIdx, slotIdx, startHour: s.startHour, duration: s.duration, student: s.student, lessonType: Array.isArray(s.lessonType) ? [...s.lessonType] : (s.lessonType ? [s.lessonType] : []), notes: s.notes || '' });
        }
      };

      const wouldOverlap = (dayIdx, startHour, duration, excludeSlotIdx) => {
        const newEnd = startHour + duration;
        return days[dayIdx].slots.some((s, idx) => {
          if (idx === excludeSlotIdx) return false;
          const sEnd = s.startHour + s.duration;
          return startHour < sEnd && s.startHour < newEnd;
        });
      };

      const saveEdit = () => {
        const { dayIdx, slotIdx, startHour, duration, student, lessonType, notes } = edit;
        if (wouldOverlap(dayIdx, startHour, duration, slotIdx === 'new' ? -1 : slotIdx)) {
          alert('This slot overlaps with another time.');
          return;
        }
        setDays(prev => prev.map((d, i) => {
          if (i !== dayIdx) return d;
          const slots = [...d.slots];
          const slot = { startHour, duration, student: student.trim(), lessonType: (Array.isArray(lessonType) ? lessonType : []).map(t => t.trim()).filter(Boolean), notes: (notes || '').trim() };
          if (slotIdx === 'new') slots.push(slot);
          else slots[slotIdx] = slot;
          slots.sort((a, b) => a.startHour - b.startHour);
          return { ...d, slots };
        }));
        setEdit(null);
      };

      const removeSlot = () => {
        if (edit.slotIdx === 'new') { setEdit(null); return; }
        setDays(prev => prev.map((d, i) => {
          if (i !== edit.dayIdx) return d;
          return { ...d, slots: d.slots.filter((_, si) => si !== edit.slotIdx) };
        }));
        setEdit(null);
      };

      const doReset = () => { setCoach('Saul'); setDays(INITIAL_DATA); setConfirmReset(false); };

      const saveAsImage = async (elementId, label) => {
        if (!h2cReady || !window.html2canvas) { alert('Image library is loading. Please try again in a moment.'); return; }
        setExporting(label);
        try {
          const target = document.getElementById(elementId);
          if (!target) throw new Error(`Element ${elementId} not found`);
          await new Promise(r => requestAnimationFrame(r));
          const canvas = await window.html2canvas(target, {
            backgroundColor: '#080c16', scale: 2, useCORS: true, allowTaint: true, logging: false,
            width: target.scrollWidth, height: target.scrollHeight,
            windowWidth: target.scrollWidth, windowHeight: target.scrollHeight,
            onclone: (clonedDoc) => {
              const allEls = clonedDoc.querySelectorAll('*');
              allEls.forEach(el => {
                const s = el.style;
                const bg = (s.background || '') + (s.backgroundImage || '');
                const usesClip = s.webkitBackgroundClip === 'text' || s.backgroundClip === 'text' || s.webkitTextFillColor === 'transparent';
                if (usesClip && bg.includes('linear-gradient')) {
                  const match = bg.match(/#[a-fA-F0-9]{3,6}|rgba?\([^)]+\)/);
                  const color = match ? match[0] : '#bef264';
                  s.background = 'none'; s.backgroundImage = 'none';
                  s.webkitBackgroundClip = 'unset'; s.backgroundClip = 'unset';
                  s.webkitTextFillColor = color; s.color = color;
                }
              });
              const style = clonedDoc.createElement('style');
              style.textContent = `* { animation: none !important; transition: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }`;
              clonedDoc.head.appendChild(style);
            },
          });
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
          if (!blob) throw new Error('toBlob null');
          const blobUrl = URL.createObjectURL(blob);
          const dataUrl = canvas.toDataURL('image/png');
          const filename = `PS_${label}_${coach}_${new Date().toISOString().slice(0,10)}.png`;
          setImagePreview({ dataUrl, blobUrl, blob, filename });
        } catch (e) { console.error(e); alert('Image generation failed: ' + (e.message || e)); }
        setExporting(null);
      };

      const handleShare = async () => {
        if (!imagePreview?.blob) return;
        try {
          const file = new File([imagePreview.blob], imagePreview.filename, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'PS Coaching Schedule' });
          } else if (navigator.share) { await navigator.share({ title: 'PS Coaching Schedule' }); }
          else { alert('Sharing not supported. Long-press the image to save.'); }
        } catch (e) { if (e.name !== 'AbortError') console.error(e); }
      };
      const handleDownload = () => {
        if (!imagePreview?.blobUrl) return;
        const link = document.createElement('a');
        link.href = imagePreview.blobUrl; link.download = imagePreview.filename;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };
      const handleOpenInNewTab = () => { if (imagePreview?.blobUrl) window.open(imagePreview.blobUrl, '_blank'); };

      const ROW_HEIGHT = 42;
      const HEADER_HEIGHT = 44;
      const TIME_COL_WIDTH = 40;

      return (
        <div style={{ fontFamily: "'Outfit', system-ui, sans-serif" }} className="min-h-screen w-full text-slate-100">

          {updateAvailable && (
            <div className="sticky top-0 z-[80] bg-[#bef264] text-slate-900 px-4 py-2 text-sm font-bold flex items-center justify-between">
              <span>New version available</span>
              <button onClick={() => window.location.reload()} className="px-3 py-1 rounded-md bg-slate-900 text-[#bef264] text-xs">Update</button>
            </div>
          )}

          <div id="schedule-only-export" style={{ background: 'linear-gradient(180deg, #080c16 0%, #0d1422 50%, #121828 100%)' }} className="relative overflow-hidden">
            <div style={{ position: 'absolute', top: '-150px', left: '-100px', width: '400px', height: '400px', background: 'radial-gradient(circle, rgba(190,242,100,0.12) 0%, transparent 70%)', pointerEvents: 'none' }} />

                    <div className="text-[10px] text-slate-500 mt-1.5">Multiple students = comma separated (e.g. <span className="mono">Jiwon, HK</span>)</div>

                  <div>
                    <label className="block text-[10px] font-bold tracking-[0.2em] mb-2" style={{ color: DAY_COLORS[edit.dayIdx].main }}>LESSON TYPES <span className="opacity-50 font-normal">(select multiple)</span></label>
                    <div className="flex flex-wrap gap-1.5 mb-2">
                      {lessonTypes.map(t => {
                        const selected = (edit.lessonType || []).includes(t);
                        const isCustom = customLessonTypes.includes(t);
                        const tc = typeColor(t);
                        return (
                          <button
                            key={t}
                            onClick={() => {
                              const cur = edit.lessonType || [];
                              setEdit({...edit, lessonType: cur.includes(t) ? cur.filter(x => x !== t) : [...cur, t]});
                            }}
                            className="px-3 py-1.5 rounded-full text-[12px] font-bold transition active:scale-95 inline-flex items-center"
                            style={{ background: selected ? tc : `${tc}15`, color: selected ? '#0f1729' : tc, border: selected ? 'none' : `1px solid ${tc}40` }}
                          >
                            {selected ? '✓ ' : ''}{t}
                            {isCustom && (
                              <span
                                onClick={(e) => { e.stopPropagation(); setConfirmDeleteType(t); }}
                                role="button"
                                className="ml-1.5 inline-flex items-center justify-center w-4 h-4 rounded-full text-[11px] leading-none transition hover:scale-110"
                                style={{ background: selected ? 'rgba(15,23,41,0.25)' : `${tc}30`, color: 'inherit' }}
                                title="Delete this custom type"
                              >×</span>
                            )}
                          </button>
                        );
                      })}
                      {(edit.lessonType || []).filter(t => !lessonTypes.includes(t)).map(t => (
                        <button
                          key={t}
                          onClick={() => setEdit({...edit, lessonType: (edit.lessonType || []).filter(x => x !== t)})}
                          className="px-3 py-1.5 rounded-full text-[12px] font-bold transition active:scale-95 inline-flex items-center gap-1"
                          style={{ background: '#94a3b8', color: '#0f1729' }}
                          title="Orphan tag from old data — tap to remove"
                        >
                          {t}<span className="opacity-70 ml-0.5">×</span>
                        </button>
                      ))}
                    </div>
                    <input
                      type="text"
                      placeholder="New lesson type — press Enter to save (e.g. Defend)"
                      className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none transition"
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          const v = e.target.value.trim();
                          if (v) {
                            addCustomLessonType(v);
                            if (!(edit.lessonType || []).includes(v)) {
                              setEdit({...edit, lessonType: [...(edit.lessonType || []), v]});
                            }
                          }
                          e.target.value = '';
                        }
                      }}
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold tracking-[0.2em] mb-2" style={{ color: DAY_COLORS[edit.dayIdx].main }}>NOTES <span className="opacity-50 font-normal">(shown in breakdown only)</span></label>
                    <textarea
                      value={edit.notes || ''}
                      onChange={e => setEdit({...edit, notes: e.target.value})}
                      placeholder="Optional details — e.g., what to focus on, technique to work on..."
                      rows={2}
                      className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none transition resize-none"
                    />
                  </div>
                </div>

                <div className="flex gap-2 mt-7">
                  {edit.slotIdx !== 'new' && (<button onClick={removeSlot} className="px-4 py-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 active:scale-95 font-semibold transition-all">Delete</button>)}
                  <button onClick={() => setEdit(null)} className="flex-1 px-4 py-3.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 active:scale-95 text-slate-300 font-semibold transition-all">Cancel</button>
                  <button onClick={saveEdit} className="flex-1 px-4 py-3.5 rounded-xl active:scale-95 text-slate-900 font-bold transition-all" style={{ background: DAY_COLORS[edit.dayIdx].main }}>Save</button>
                </div>
              </div>
            </div>
          )}

          {editCoach && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 anim-pop" onClick={() => setEditCoach(false)}>
              <div className="bg-[#182132] border border-slate-700 rounded-3xl w-full max-w-sm p-7 anim-slide" onClick={e => e.stopPropagation()} style={{ fontFamily: "'Outfit', system-ui, sans-serif" }}>
                <div className="text-xl font-black text-slate-100 mb-1">Coach name</div>
                <div className="text-xs text-slate-500 mb-5">Coach name shown at the top</div>
                <input type="text" value={tempCoach} onChange={e => setTempCoach(e.target.value)} autoFocus className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-[#bef264] focus:outline-none transition" />
                <div className="flex gap-2 mt-6">
                  <button onClick={() => setEditCoach(false)} className="flex-1 px-4 py-3.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 font-semibold transition">Cancel</button>
                  <button onClick={() => { if (tempCoach.trim()) setCoach(tempCoach.trim()); setEditCoach(false); }} className="flex-1 px-4 py-3.5 rounded-xl text-slate-900 font-bold transition" style={{ background: 'linear-gradient(135deg, #bef264 0%, #7dd3fc 100%)' }}>Save</button>
                </div>
              </div>
            </div>
          )}

          {confirmReset && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 anim-pop" onClick={() => setConfirmReset(false)}>
              <div className="bg-[#182132] border border-slate-700 rounded-3xl w-full max-w-sm p-7 anim-slide" onClick={e => e.stopPropagation()} style={{ fontFamily: "'Outfit', system-ui, sans-serif" }}>
                <div className="text-xl font-black text-slate-100 mb-2">Reset everything?</div>
                <div className="text-sm text-slate-400 mb-6">All changes will be lost and the schedule will revert to defaults.</div>
                <div className="flex gap-2">
                  <button onClick={() => setConfirmReset(false)} className="flex-1 px-4 py-3.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 font-semibold transition">Cancel</button>
                  <button onClick={doReset} className="flex-1 px-4 py-3.5 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 hover:bg-red-500/30 font-bold transition">Reset</button>
                </div>
              </div>
            </div>
          )}

          {loadBanner && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[70] anim-pop">
              <div className="px-4 py-2.5 rounded-full text-sm font-bold text-slate-900 shadow-2xl inline-flex items-center gap-2" style={{ background: 'linear-gradient(135deg, #bef264 0%, #7dd3fc 100%)' }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>
                Shared schedule loaded
              </div>
            </div>
          )}

          {showShareModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-end sm:items-center justify-center sm:p-4 anim-pop" onClick={() => setShowShareModal(false)}>
              <div className="bg-[#182132] border border-slate-700 rounded-t-3xl sm:rounded-3xl w-full sm:max-w-md p-6 sm:p-7 anim-slide max-h-[92vh] overflow-y-auto" onClick={e => e.stopPropagation()} style={{ fontFamily: "'Outfit', system-ui, sans-serif" }}>
                <div className="flex items-start justify-between mb-4">
                  <div>
                    <div className="text-xl font-black text-slate-100 inline-flex items-center gap-2">
                      <span style={{ color: '#bef264' }}>✓</span> Auto-saved
                    </div>
                    <div className="text-xs text-slate-400 mt-0.5">Your schedule is saved on this device. Copy this link to share or back up.</div>
                  </div>
                  <button onClick={() => setShowShareModal(false)} className="text-slate-500 hover:text-slate-300 text-2xl leading-none w-8 h-8 flex items-center justify-center shrink-0">×</button>
                </div>

                <div className="space-y-5">
                  <div>
                    <label className="block text-[10px] font-bold tracking-[0.2em] text-[#bef264] mb-2">SHARE LINK</label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        readOnly
                        value={shareUrl}
                        onClick={e => e.target.select()}
                        className="flex-1 mono text-[10px] bg-slate-900/70 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-300 focus:outline-none truncate"
                      />
                      <button onClick={handleCopyShare} className="px-4 py-2.5 rounded-xl font-bold text-slate-900 transition active:scale-95 inline-flex items-center justify-center gap-1.5 text-sm shrink-0" style={{ background: copySuccess ? 'linear-gradient(135deg, #34d399 0%, #6ee7b7 100%)' : 'linear-gradient(135deg, #bef264 0%, #7dd3fc 100%)' }}>
                        {copySuccess ? (
                          <React.Fragment><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>Copied</React.Fragment>
                        ) : (
                          <React.Fragment><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</React.Fragment>
                        )}
                      </button>
                    </div>
                    <div className="text-[10px] text-slate-500 mt-1.5 leading-snug">
                      Anyone with this link can load this exact schedule. The link contains all data (no server needed).
                    </div>
                  </div>

                  <div className="flex items-center gap-3 text-slate-600 text-[10px] tracking-widest font-bold">
                    <div className="flex-1 h-px bg-slate-700"></div>
                    OR
                    <div className="flex-1 h-px bg-slate-700"></div>
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold tracking-[0.2em] text-[#f9a8d4] mb-2">LOAD A SHARED SCHEDULE</label>
                    <textarea
                      value={pasteInput}
                      onChange={e => setPasteInput(e.target.value)}
                      placeholder="Paste a share link or code here..."
                      rows={3}
                      className="w-full mono text-[10px] bg-slate-900/70 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-300 placeholder-slate-600 focus:outline-none focus:border-[#f9a8d4] transition resize-none"
                    />
                    <button onClick={handleLoadFromInput} disabled={!pasteInput.trim()} className="w-full mt-2 px-4 py-2.5 rounded-xl font-bold text-slate-900 transition active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed inline-flex items-center justify-center gap-1.5 text-sm" style={{ background: 'linear-gradient(135deg, #f9a8d4 0%, #fcd34d 100%)' }}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                      Load Schedule
                    </button>
                    <div className="text-[10px] text-slate-500 mt-1.5 leading-snug">
                      Note: loading will replace your current schedule. Save the current link first if needed.
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {confirmDeleteType && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[60] flex items-center justify-center p-4 anim-pop" onClick={() => setConfirmDeleteType(null)}>
              <div className="bg-[#182132] border border-slate-700 rounded-3xl w-full max-w-sm p-7 anim-slide" onClick={e => e.stopPropagation()} style={{ fontFamily: "'Outfit', system-ui, sans-serif" }}>
                <div className="text-xl font-black text-slate-100 mb-2">Delete lesson type?</div>
                <div className="text-sm text-slate-400 mb-3">
                  <span className="font-bold px-2 py-0.5 rounded-full mr-1" style={{ background: `${typeColor(confirmDeleteType)}22`, color: typeColor(confirmDeleteType), border: `1px solid ${typeColor(confirmDeleteType)}44` }}>
                    {confirmDeleteType}
                  </span>
                  will be removed from presets and all slots that currently use it.
                </div>
                <div className="flex gap-2 mt-5">
                  <button onClick={() => setConfirmDeleteType(null)} className="flex-1 px-4 py-3.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 font-semibold transition">Cancel</button>
                  <button onClick={() => deleteCustomLessonType(confirmDeleteType)} className="flex-1 px-4 py-3.5 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 hover:bg-red-500/30 font-bold transition">Delete</button>
                </div>
              </div>
            </div>
          )}

          {imagePreview && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 anim-pop" onClick={() => { if (imagePreview.blobUrl) URL.revokeObjectURL(imagePreview.blobUrl); setImagePreview(null); }}>
              <div className="max-w-md w-full max-h-full overflow-y-auto" onClick={e => e.stopPropagation()} style={{ fontFamily: "'Outfit', system-ui, sans-serif" }}>
                <div className="bg-[#182132] border border-slate-700 rounded-3xl p-5 anim-slide">
                  <div className="flex items-center justify-between mb-3">
                    <div>
                      <div className="text-lg font-black text-slate-100">Image ready</div>
                      <div className="text-[11px] text-slate-500 mt-0.5">Save using one of the options below</div>
                    </div>
                    <button onClick={() => { if (imagePreview.blobUrl) URL.revokeObjectURL(imagePreview.blobUrl); setImagePreview(null); }} className="text-slate-500 hover:text-slate-300 text-2xl leading-none w-8 h-8 flex items-center justify-center">×</button>
                  </div>
                  <div className="rounded-xl border border-slate-700 overflow-hidden bg-slate-900"><img src={imagePreview.dataUrl} alt="Schedule" className="w-full block" style={{ touchAction: 'manipulation' }} /></div>
                  <div className="mt-4 text-[11px] text-slate-400 bg-slate-800/50 rounded-lg p-2.5 leading-relaxed">
                    📱 <b className="text-slate-200">Mobile:</b> <b className="text-[#bef264]">Long-press</b> the image to save to Photos, or tap <b className="text-[#bef264]">Share</b><br/>
                    💻 <b className="text-slate-200">Desktop:</b> Right-click image → Save, or click <b className="text-[#bef264]">Download</b>
                  </div>
                  <div className="grid grid-cols-2 gap-2 mt-3">
                    {typeof navigator !== 'undefined' && navigator.share && (
                      <button onClick={handleShare} className="col-span-2 px-4 py-3.5 rounded-xl text-slate-900 font-bold transition active:scale-95 inline-flex items-center justify-center gap-2" style={{ background: 'linear-gradient(135deg, #bef264 0%, #7dd3fc 50%, #f9a8d4 100%)' }}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                        Share / Save to Photos
                      </button>
                    )}
                    <button onClick={handleDownload} className="px-4 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold transition active:scale-95 inline-flex items-center justify-center gap-2 text-sm">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                      Download
                    </button>
                    <button onClick={handleOpenInNewTab} className="px-4 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold transition active:scale-95 inline-flex items-center justify-center gap-2 text-sm">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                      New tab
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Schedule />);
  </script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          // Detect new SW waiting → notify page
          if (reg.waiting) {
            navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({ type: 'UPDATE_AVAILABLE' });
          }
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                // New version installed, page is currently controlled by older SW
                navigator.serviceWorker.controller.postMessage({ type: 'UPDATE_AVAILABLE' });
                // Optionally activate immediately
                nw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch((err) => console.warn('SW registration failed:', err));

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
